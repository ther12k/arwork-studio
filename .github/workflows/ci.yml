# CI for the Color Duel Art Studio monorepo.
# Backend: python test suite (pipeline + API + game adapter contract) + a REAL
# release-archive leak assertion (fails when workspace/env/log/db/pycache
# entries ship).
# Frontend: typecheck (strict, no emit) + lint + the full static production
# build (vite build; cheap and sandbox-safe since the app left Next.js).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-services/color-duel-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test suite
        run: python -m pytest tests/test_pipeline.py tests/test_api.py tests/test_game_adapter.py -q
      - name: Release archive hygiene
        run: |
          python scripts/package_release.py
          if tar -tzf dist/*.tar.gz | grep -E 'workspace/|\.env$|\.log$|__pycache__|\.db$'; then
            echo "FORBIDDEN FILES FOUND IN RELEASE ARCHIVE"; exit 1
          fi
          echo "Archive clean: no workspace/env/log/db/pycache entries."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck (strict, no emit)
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Static production build
        run: bun run build

# CI for the Color Duel Art Studio monorepo.
# Backend: python test suite (pipeline + API + game adapter contract).
# Frontend: typecheck + lint (full production build stays local-only per the
# sandbox rules; this workflow mirrors what CI should gate a merge on).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-services/color-duel-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test suite
        run: python -m pytest tests/test_pipeline.py tests/test_api.py tests/test_game_adapter.py -q
      - name: Release archive hygiene
        run: python scripts/package_release.py && tar -tzf dist/*.tar.gz | grep -Ev 'workspace|\.env|\.log|__pycache__' > /dev/null

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint (includes Next.js rules)
        run: bun run lint
